plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.appshield'
    compileSdk 35

    defaultConfig {
        applicationId 'com.esenkn.appshield'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    signingConfigs {
        release {
            storeFile file(providers.gradleProperty("APP_RELEASE_STORE_FILE").get())
            storePassword providers.gradleProperty("APP_RELEASE_STORE_PASSWORD").get()
            keyAlias providers.gradleProperty("APP_RELEASE_KEY_ALIAS").get()
            keyPassword providers.gradleProperty("APP_RELEASE_KEY_PASSWORD").get()
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
