plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingFile = new File(
    System.getProperty("user.home"),
    ".appshield-signing.properties"
)

def signingProperties = new Properties()

if (signingFile.exists()) {
    signingFile.withInputStream {
        signingProperties.load(it)
    }
}

def releaseStorePassword =
        providers.gradleProperty("APP_RELEASE_STORE_PASSWORD").orNull

def releaseKeyPassword =
        providers.gradleProperty("APP_RELEASE_KEY_PASSWORD").orNull

def releaseStoreFile =
        providers.gradleProperty("APP_RELEASE_STORE_FILE").orNull

def releaseKeyAlias =
        providers.gradleProperty("APP_RELEASE_KEY_ALIAS").orNull

def releaseSigningConfigured =
        releaseStorePassword &&
        releaseKeyPassword &&
        releaseStoreFile &&
        releaseKeyAlias

android {
    namespace 'com.example.appshield'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.esenkn.appshield'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.0.6'
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseStoreFile)
                storeType signingProperties.getProperty('storeType', 'PKCS12')
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {}

        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
