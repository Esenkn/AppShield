plugins {
    id 'com.android.application'
}

def releaseStoreFile = providers.gradleProperty("APP_RELEASE_STORE_FILE").orNull
def releaseStorePassword = providers.gradleProperty("APP_RELEASE_STORE_PASSWORD").orNull
def releaseKeyAlias = providers.gradleProperty("APP_RELEASE_KEY_ALIAS").orNull
def releaseKeyPassword = providers.gradleProperty("APP_RELEASE_KEY_PASSWORD").orNull

def releaseSigningConfigured =
        releaseStoreFile &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

android {
    namespace 'com.example.appshield'
    compileSdk 35

    defaultConfig {
        applicationId 'com.esenkn.appshield'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
    }

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }

            minifyEnabled false
        }
    }
}
